name: Build and Push GHCR Images

on:
  push:
    branches: [master]
    paths:
      - 'Dockerfile.*'
      - '.github/workflows/build-images.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/peppekerstens/pwsh-pester

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: Dockerfile.ubuntu
            tag: ubuntu:24.04
            image_name: pwsh-pester-ubuntu
            image_tag: 24.04
          - dockerfile: Dockerfile.debian
            tag: debian:12
            image_name: pwsh-pester-debian
            image_tag: "12"
          - dockerfile: Dockerfile.fedora
            tag: fedora:40
            image_name: pwsh-pester-fedora
            image_tag: "40"
          - dockerfile: Dockerfile.opensuse
            tag: opensuse/tumbleweed
            image_name: pwsh-pester-opensuse
            image_tag: tumbleweed
          - dockerfile: Dockerfile.arch
            tag: archlinux
            image_name: pwsh-pester-arch
            image_tag: latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.image_name }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY }}/peppekerstens/${{ matrix.image_name }}:${{ matrix.image_tag }}
          cache-from: type=gha,scope=${{ matrix.image_name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image_name }}
